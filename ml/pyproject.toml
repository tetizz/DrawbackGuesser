[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "drawbackguesser-ml"
version = "0.1.0"
description = "Leakage-audited model training tools for DrawbackGuesser"
requires-python = ">=3.11"
dependencies = ["chess>=1.11,<2", "torch>=2.4,<3"]

[project.scripts]
drawbackguesser-train = "drawback_ml.cli:main"

[tool.setuptools]
package-dir = {"" = "training"}

[tool.setuptools.packages.find]
where = ["training"]
