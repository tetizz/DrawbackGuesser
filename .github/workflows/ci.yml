name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/check-staging-boundary.mjs
      - run: python -m compileall -q ml/training ml/evaluation

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: node scripts/require-engine.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          python -m pip install "chess==1.11.2"
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run TypeScript tests without CPU oversubscription
        run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm build
      - run: pnpm check:capturable-vocabulary
        env:
          SCHEMA9_PYTHON_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
      - name: Run Python training tests
        run: python -m unittest discover -s ml/training/tests -v
      - name: Run Python evaluation tests
        run: python -m unittest discover -s ml/evaluation/tests -v
      - run: python -m compileall -q ml/training ml/evaluation

  windows-schema9-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: node scripts/require-engine.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install bounded Python lifecycle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          python -m pip install "chess==1.11.2"
      - run: pnpm engine:build
      - run: pnpm --filter @drawbackguesser/dataset-cli build
      - run: >-
          pnpm exec vitest run
          apps/dataset-cli/src/schema9-ledger-cli.test.ts
          apps/dataset-cli/src/schema9-process-lifecycle.test.ts
          apps/dataset-cli/src/schema9-producer-runtime-identity.test.ts
          packages/trace-to-dataset/src/schema9-atomic-publication.test.ts
          packages/trace-to-dataset/src/schema9-corpus-ledger.test.ts
          packages/trace-to-dataset/src/schema9-stable-file.test.ts
          scripts/isolated-python.test.mjs
      - name: Run Windows Python process-containment regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "ml/training;ml/training/tests"
          python -m unittest -v `
            ml.evaluation.tests.test_release_workflow.ReleaseWorkflowTests.test_nonzero_runners_preserve_child_error_when_cleanup_fails `
            ml.evaluation.tests.test_release_workflow.ReleaseWorkflowTests.test_closed_environment_ignores_hostile_windows_variables `
            ml.evaluation.tests.test_release_workflow.ReleaseWorkflowTests.test_taskkill_nonzero_fails_closed `
            ml.evaluation.tests.test_release_workflow.ReleaseWorkflowTests.test_selection_cancellation_terminates_descendant_process `
            ml.evaluation.tests.test_release_workflow.ReleaseWorkflowTests.test_successful_fast_parent_still_terminates_grandchild `
            ml.evaluation.tests.test_browser_parity.BrowserParityTest.test_browser_nonzero_preserves_child_error_when_cleanup_fails `
            ml.evaluation.tests.test_browser_parity.BrowserParityTest.test_taskkill_nonzero_fails_closed `
            ml.evaluation.tests.test_browser_parity.BrowserParityTest.test_browser_timeout_terminates_descendant_process `
            ml.evaluation.tests.test_browser_parity.BrowserParityTest.test_browser_fast_parent_success_terminates_grandchild `
            test_capturable_fixed_corpus.CapturableFixedCorpusTests.test_nonzero_command_preserves_failure_when_cleanup_fails `
            test_capturable_fixed_corpus.CapturableFixedCorpusTests.test_taskkill_nonzero_fails_closed `
            test_capturable_fixed_corpus.CapturableFixedCorpusTests.test_timed_out_command_terminates_descendant_process `
            test_capturable_fixed_corpus.CapturableFixedCorpusTests.test_successful_fast_parent_terminates_descendant_process `
            ml.evaluation.tests.test_real_domain_benchmark.RealDomainBenchmarkTests.test_taskkill_ignores_hostile_environment_and_is_bounded `
            ml.evaluation.tests.test_real_domain_benchmark.RealDomainBenchmarkTests.test_taskkill_nonzero_and_identity_change_fail_closed `
            ml.evaluation.tests.test_real_domain_benchmark.RealDomainBenchmarkTests.test_tree_cleanup_closes_job_before_bounded_wait `
            ml.evaluation.tests.test_real_domain_benchmark.RealDomainBenchmarkTests.test_cleanup_failure_does_not_mask_primary_failure `
            ml.evaluation.tests.test_real_domain_benchmark.RealDomainBenchmarkTests.test_subprocess_fast_parent_exit_still_kills_descendant
