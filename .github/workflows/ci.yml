name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node scripts/check-staging-boundary.mjs
      - run: python -m compileall -q ml/training ml/evaluation

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: node scripts/require-engine.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          python -m pip install "chess==1.11.2"
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Run TypeScript tests without CPU oversubscription
        run: pnpm exec vitest run --maxWorkers=1
      - run: pnpm build
      - name: Run Python training tests
        run: python -m unittest discover -s ml/training/tests -v
      - name: Run Python evaluation tests
        run: python -m unittest discover -s ml/evaluation/tests -v
      - run: python -m compileall -q ml/training ml/evaluation
